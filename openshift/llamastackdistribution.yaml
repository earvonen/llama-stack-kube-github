# Requires the RHOAI-managed Llama Stack Operator (DataScienceCluster
# spec.components.llamastackoperator.managementState: Managed).
apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: llamastack
  namespace: agentic-demo
spec:
  replicas: 1
  server:
    distribution:
      # RHOAI 3.4 image (Llama Stack 0.7.x). Cluster pulls registry.redhat.io via the global pull secret.
      image: registry.redhat.io/rhoai/odh-llama-stack-core-rhel9:v3.4
    userConfig:
      configMapName: llamastack-server-config
    storage:
      size: 20Gi
      mountPath: "/.llama"
    containerSpec:
      port: 8321
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "2"
          memory: "8Gi"
      env:
        - name: SQLITE_STORE_DIR
          value: "/.llama/distributions/starter"
        - name: VLLM_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: VLLM_URL
        - name: VLLM_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: llamastack-credentials
              key: vllm-api-token
        # Set to "false" if vLLM is HTTPS with a cluster CA the image does not trust.
        - name: VLLM_TLS_VERIFY
          value: "false"
        - name: MCP_GITHUB_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_GITHUB_SSE_URL
        - name: MCP_OPENSHIFT_SSE_URL
          valueFrom:
            configMapKeyRef:
              name: llamastack-mcp-endpoints
              key: MCP_OPENSHIFT_SSE_URL
